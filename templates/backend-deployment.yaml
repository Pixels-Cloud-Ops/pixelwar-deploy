apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ahmed103c/pixelwar-back:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 7009
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:7009"
            - name: ConnectionStrings__PixelsDB
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: ConnectionStrings__PixelsDB
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  selector:
    app: backend
  ports:
    - port: 7009
      targetPort: 7009