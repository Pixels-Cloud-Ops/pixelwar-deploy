---
- name: "Installation Observabilité — Prometheus + Grafana"
  hosts: master
  become: yes

  vars:
    grafana_password: "pixelwar2026"
    grafana_nodeport: 32000
    prometheus_nodeport: 30090

  tasks:
    - name: "Installer Helm"
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: "Ajouter repo Prometheus"
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: "Créer namespace monitoring"
      shell: kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: "Installer Prometheus + Grafana via Helm"
      shell: |
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
          --namespace monitoring \
          --set grafana.adminPassword="{{ grafana_password }}" \
          --set grafana.service.type=NodePort \
          --set grafana.service.nodePort={{ grafana_nodeport }} \
          --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
          --set prometheus.service.type=NodePort \
          --set prometheus.service.nodePort={{ prometheus_nodeport }}
          --set prometheus.prometheusSpec.nodePort={{ prometheus_nodeport }}
          
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: "Attendre que Grafana soit prêt"
      shell: |
        kubectl wait --for=condition=ready pod \
          -l app.kubernetes.io/name=grafana \
          -n monitoring \
          --timeout=180s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: "Appliquer le ServiceMonitor backend"
      shell: kubectl apply -f /home/ubuntu/templates/backend-servicemonitor.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml